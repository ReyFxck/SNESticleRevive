name: Finalize 1.0.8 release notes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-1.0.8.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Update stable release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit 1.0.8 \
            --title "SNESTICLE REVIVE 1.0.8 [STABLE]" \
            --notes-file CHANGELOG_v1.0.8.md \
            --latest
