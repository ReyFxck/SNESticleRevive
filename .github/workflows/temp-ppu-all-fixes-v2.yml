name: Temporary PPU optimized final validation

on:
  push:
    branches:
      - dev/1.1.1-ppu-accuracy

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Host mapper tests
        run: |
          set -euxo pipefail
          cd tools/romtest
          bash build.sh
          ./rom_test

      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y genisoimage

      - name: Build release
        env:
          PS2DEV: ${{ runner.temp }}/ps2dev
        run: |
          set -euxo pipefail
          mkdir -p empty_roms artifact/release
          make iso ROMS="$PWD/empty_roms" PACK=0 JOBS=2 AUTO_INSTALL=yes VERBOSE=1 \
            SNES_DIAGNOSTICS=0 APP_VERSION=1.1.1-ppu-opt PS2DEV="$PS2DEV"
          cp -a build/iso_root artifact/release/iso_root
          cp build/SNESticle.stripped.elf artifact/release/SNESticle-1.1.1-ppu-opt.elf
          make clean || true

      - name: Build diagnostic
        env:
          PS2DEV: ${{ runner.temp }}/ps2dev
        run: |
          set -euxo pipefail
          mkdir -p artifact/diag
          make iso ROMS="$PWD/empty_roms" PACK=0 JOBS=2 AUTO_INSTALL=yes VERBOSE=1 \
            SNES_DIAGNOSTICS=2 APP_VERSION=1.1.1-ppu-opt-diag PS2DEV="$PS2DEV"
          cp -a build/iso_root artifact/diag/iso_root
          cp build/SNESticle.stripped.elf artifact/diag/SNESticle-1.1.1-ppu-opt-diag.elf
          printf '%s\n' "$GITHUB_SHA" > artifact/BUILD_COMMIT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ppu-optimized-final-kit
          path: artifact/
          retention-days: 1
