name: DSP4 NEC LLE test

on:
  push:
    branches:
      - feat/dsp4-nec-lle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test NEC DSP core and replacement program
        run: |
          chmod +x tools/necdsptest/build.sh
          tools/necdsptest/build.sh

      - name: Validate DSP-4 cartridge map
        run: |
          python3 tools/dsp4_map_test.py

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget

      - name: Install/check PS2DEV
        run: |
          make check-env AUTO_INSTALL=yes COLOR=0

      - name: Build test ELF
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          make elf \
            APP_VERSION="1.0.8-tg3k-transition-trace-test6" \
            AUTO_INSTALL=yes \
            COLOR=0 \
            JOBS=2 \
            PACK=1 \
            SNES_DIAGNOSTICS=2 \
            DSP4_TRACE=1 \
            out="$GITHUB_WORKSPACE/dist"
          (cd dist && sha256sum *.elf > SHA256SUMS.txt)
          ls -lh dist

      - name: Upload test ELF
        uses: actions/upload-artifact@v4
        with:
          name: SNESticle-Revive-tg3k-transition-trace-test6
          path: dist/*
          if-no-files-found: error
