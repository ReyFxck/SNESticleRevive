name: Build issue 56 test ELF

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-issue-56-test-elf.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION: 1.0.9
  TEST_TARGET_SHA: 2e852e9abe64896e9f0c40861fb7f3d93846776c

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout fixed source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_TARGET_SHA }}

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget genisoimage

      - name: Install/check PS2DEV toolchain
        run: make check-env AUTO_INSTALL=yes COLOR=0

      - name: Build test ELF
        run: |
          rm -rf dist
          mkdir -p dist
          make iso \
            APP_VERSION="$APP_VERSION" \
            AUTO_INSTALL=yes \
            COLOR=0 \
            JOBS=2 \
            PACK=1 \
            out="$GITHUB_WORKSPACE/dist"
          ls -lh dist
          grep -a -l "SNESticle Revive PS2 v1.0.9" dist/*.elf

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: issue-56-test-build
          path: |
            dist/*.elf
            dist/*.iso
          if-no-files-found: error
