name: Main Builds

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Cancel obsolete builds of the same branch.
concurrency:
  group: main-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: PS2 builds (release, diag1, diag2)
    runs-on: ubuntu-24.04
    # Three clean compilations on one runner; dependencies are prepared once.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up tool paths and Python cache identity
        id: toolpaths
        shell: bash
        run: |
          echo "PS2DEV=$HOME/.local/ps2dev" >> "$GITHUB_ENV"
          echo "PS2SDK=$HOME/.local/ps2dev/ps2sdk" >> "$GITHUB_ENV"
          echo "GSKIT=$HOME/.local/ps2dev/gsKit" >> "$GITHUB_ENV"
          echo "PS2DEV_CACHE_DIR=$HOME/.cache/ps2dev" >> "$GITHUB_ENV"
          echo "PS2_PACKER_SRC_DIR=$HOME/.cache/ps2dev/ps2-packer-src" >> "$GITHUB_ENV"
          echo "CI_PYTHON_ENV=$HOME/.cache/snesticle-ci/venv" >> "$GITHUB_ENV"
          echo "python=$(python3 -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
          for directory in bin ee/bin iop/bin dvp/bin ps2sdk/bin; do
            echo "$HOME/.local/ps2dev/$directory" >> "$GITHUB_PATH"
          done

      - name: Restore PS2DEV and packer cache
        id: ps2cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.local/ps2dev
            ~/.cache/ps2dev
          key: ps2dev-ubuntu-24.04-v3
          restore-keys: |
            ps2dev-ubuntu-24.04-v2

      - name: Prepare PS2DEV and packer only if missing
        shell: bash
        run: bash tools/ci/prepare-deps.sh ps2

      # Save before tests/builds, so a regression or a later cancellation does
      # not force all dependencies to be downloaded again on the next push.
      - name: Save PS2DEV and packer cache
        if: steps.ps2cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.local/ps2dev
            ~/.cache/ps2dev
          key: ps2dev-ubuntu-24.04-v3

      - name: Restore CPU-test Python environment
        id: pycache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/snesticle-ci/venv
          key: snesticle-python-ubuntu24-${{ runner.arch }}-${{ steps.toolpaths.outputs.python }}-${{ hashFiles('tools/ci/requirements.txt') }}-v1

      - name: Prepare CPU-test Python environment only if missing
        shell: bash
        run: bash tools/ci/prepare-deps.sh python

      - name: Save CPU-test Python environment
        if: steps.pycache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/snesticle-ci/venv
          key: snesticle-python-ubuntu24-${{ runner.arch }}-${{ steps.toolpaths.outputs.python }}-${{ hashFiles('tools/ci/requirements.txt') }}-v1

      - name: Verify HostFS URI and directory handling
        run: python3 tools/test_hostfs_saf.py

      - name: Verify boot origin and lazy storage policy
        run: python3 tools/test_boot_origin.py

      - name: Verify PPU hot-path equivalence
        run: bash tools/pputest/test_hotpath.sh

      - name: Verify VU0 shadow model and fallback
        run: bash tools/pputest/test_vu0_shadow.sh

      - name: Verify DSP mixer feedback and PCM
        run: bash tools/pputest/test_mixer_feedback.sh

      - name: Verify SPC700 I/O timing and BRR decode
        run: bash tools/pputest/test_spc_brr_hotpath.sh

      - name: Verify PPU memory ports, raster registers and SPC timers
        run: bash tools/pputest/test_hardware_accuracy.sh

      - name: Verify 65C816 bus and interrupt host regressions
        run: |
          bash tools/cputest/build.sh
          tools/cputest/cpu_test </dev/null

      - name: Verify SA-1 and SuperFX host regressions
        run: |
          bash tools/sa1test/build.sh
          tools/sa1test/sa1_test
          bash tools/superfxtest/build.sh
          tools/superfxtest/gsu_test

      - name: Verify integrated portable ROM Lab
        run: |
          bash tools/romlab/build.sh
          tools/romlab/romlab self-test

      - name: Build and validate packed release
        shell: bash
        run: bash tools/ci/build-variant.sh release

      - name: Build packed diagnostic 1
        shell: bash
        run: bash tools/ci/build-variant.sh diag1

      - name: Build packed diagnostic 2
        shell: bash
        run: bash tools/ci/build-variant.sh diag2

      - name: Verify exactly three deliverable ELFs
        shell: bash
        run: |
          test "$(find artifacts -type f | wc -l)" -eq 3
          for elf in SNESticle.elf SNESticle-diag1.elf SNESticle-diag2.elf; do
            test -s "artifacts/$elf"
            file "artifacts/$elf"
          done

      - name: Upload packed release
        uses: actions/upload-artifact@v4
        with:
          name: SNESticle-release
          path: artifacts/SNESticle.elf
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic 1
        uses: actions/upload-artifact@v4
        with:
          name: SNESticle-diag1
          path: artifacts/SNESticle-diag1.elf
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic 2
        uses: actions/upload-artifact@v4
        with:
          name: SNESticle-diag2
          path: artifacts/SNESticle-diag2.elf
          if-no-files-found: error
          retention-days: 30
