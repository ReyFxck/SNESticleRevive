name: Main Builds

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-matrix:
    name: PS2 Build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Release stripped & packed (~490KB) - production
          - name: release-stripped
            target: strip
            diagnostics: 0
            profile: 0
            pack: 1
            artifact_name: SNESticle-release-stripped

          # Debug with deep diagnostics (SNES_DIAGNOSTICS=2) - auto-capture every 30 frames
          - name: debug-diag2
            target: fast
            diagnostics: 2
            profile: 0
            pack: 0
            artifact_name: SNESticle-debug-diag2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PS2DEV
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/ps2dev
            ~/.cache/ps2dev
          key: ps2dev-ubuntu-24.04-v2-${{ matrix.name }}

      - name: Ensure PS2DEV toolchain
        run: make AUTO_INSTALL=yes COLOR=0 ensure-ps2dev

      - name: Clean build directory
        run: make COLOR=0 clean

      - name: Build PS2 ELF (${{ matrix.name }})
        run: |
          make AUTO_INSTALL=yes COLOR=0 JOBS=4 \
            ${{ matrix.target }} \
            SNES_DIAGNOSTICS=${{ matrix.diagnostics }} \
            PROFILE=${{ matrix.profile }} \
            PACK=${{ matrix.pack }}

      - name: Verify ELF exists and show info
        run: |
          if [ "${{ matrix.target }}" = "strip" ]; then
            ELF_PATH="build/SNESticle.stripped.elf"
            PACKED_PATH="build/SNESticle.packed.elf"
          else
            ELF_PATH="build/SNESticle.elf"
            PACKED_PATH="build/SNESticle.packed.elf"
          fi

          echo "=== Main ELF ==="
          test -s "$ELF_PATH"
          file "$ELF_PATH"
          ls -lh "$ELF_PATH"

          if [ -f "$PACKED_PATH" ]; then
            echo "=== Packed ELF ==="
            file "$PACKED_PATH"
            ls -lh "$PACKED_PATH"
          fi

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          if [ "${{ matrix.target }}" = "strip" ]; then
            cp build/SNESticle.stripped.elf "artifacts/${{ matrix.artifact_name }}.elf"
            if [ -f build/SNESticle.packed.elf ]; then
              cp build/SNESticle.packed.elf "artifacts/${{ matrix.artifact_name }}.packed.elf"
            fi
          else
            cp build/SNESticle.elf "artifacts/${{ matrix.artifact_name }}.elf"
            if [ -f build/SNESticle.packed.elf ]; then
              cp build/SNESticle.packed.elf "artifacts/${{ matrix.artifact_name }}.packed.elf"
            fi
          fi

      - name: Upload ELF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  # Create Release on tag push
  create-release:
    name: Create GitHub Release
    needs: [build-matrix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: SNESticle-*-${{ github.sha }}
          merge-multiple: true

      - name: Organize release files
        run: |
          mkdir -p release
          find artifacts -name "*.elf" -exec cp {} release/ \;
          ls -la release/

      - name: Generate release notes
        run: |
          cat > release_notes.md << 'EOF'
          # SNESticleRevive ${{ github.ref_name }}

          ## Build Variants Included

          | Variant | Description |
          |---------|-------------|
          | `SNESticle-release-stripped.elf` | Production build, stripped, packed (~490 KB) |
          | `SNESticle-release-stripped.packed.elf` | Packed version of release build |
          | `SNESticle-debug-diag2.elf` | Deep diagnostics (SNES_DIAGNOSTICS=2) - auto-captura a cada 30 frames |

          ## Installation
          1. Copy the desired `.elf` to your PS2 (via USB, HDD, SMB, etc.)
          2. Launch with OPL, wLaunchELF, or your preferred launcher
          3. For packed ELFs, they self-extract on first run

          ## Changes
          See [GitHub Releases](https://github.com/ReyFxck/SNESticleRevive/releases) or Git history.
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.elf
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true