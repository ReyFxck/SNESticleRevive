name: Main Builds

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Cancel obsolete builds of the same branch.
concurrency:
  group: main-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: PS2 Build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Release: diagnostics off, stripped and packed.
          - name: release
            diagnostics: 0
            artifact_name: SNESticle-release
            vu0_shadow: 0

          - name: diag1
            diagnostics: 1
            artifact_name: SNESticle-diag1
            vu0_shadow: 0

          # Keep a separate symbol ELF for addr2line.
          - name: diag2
            diagnostics: 2
            artifact_name: SNESticle-diag2
            vu0_shadow: 0

          - name: boot-recovery
            diagnostics: 1
            artifact_name: SNESticle-boot-recovery
            vu0_shadow: 0

          - name: diag-vu0
            diagnostics: 2
            artifact_name: SNESticle-diag-vu0
            vu0_shadow: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify HostFS URI and directory handling
        if: matrix.name == 'release'
        run: python3 tools/test_hostfs_saf.py

      - name: Verify boot origin and lazy storage policy
        if: matrix.name == 'release'
        run: python3 tools/test_boot_origin.py

      - name: Verify PPU hot-path equivalence
        if: matrix.name == 'release'
        run: bash tools/pputest/test_hotpath.sh

      - name: Verify VU0 shadow model and fallback
        if: matrix.name == 'release'
        run: bash tools/pputest/test_vu0_shadow.sh

      - name: Verify DSP mixer feedback and PCM
        if: matrix.name == 'release'
        run: bash tools/pputest/test_mixer_feedback.sh

      - name: Verify SPC700 I/O timing and BRR decode
        if: matrix.name == 'release'
        run: bash tools/pputest/test_spc_brr_hotpath.sh

      - name: Verify PPU memory ports, raster registers and SPC timers
        if: matrix.name == 'release'
        run: bash tools/pputest/test_hardware_accuracy.sh

      - name: Verify 65C816 bus and interrupt host regressions
        if: matrix.name == 'release'
        run: |
          bash tools/cputest/build.sh
          tools/cputest/cpu_test </dev/null

      - name: Verify SA-1 and SuperFX host regressions
        if: matrix.name == 'release'
        run: |
          bash tools/sa1test/build.sh
          tools/sa1test/sa1_test
          bash tools/superfxtest/build.sh
          tools/superfxtest/gsu_test

      - name: Verify integrated portable ROM Lab
        if: matrix.name == 'release'
        run: |
          bash tools/romlab/build.sh
          tools/romlab/romlab self-test

      - name: Cache PS2DEV
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/ps2dev
            ~/.cache/ps2dev
          # Shared toolchain cache across build variants.
          key: ps2dev-ubuntu-24.04-v2

      - name: Ensure PS2DEV toolchain
        run: make AUTO_INSTALL=yes COLOR=0 ensure-ps2dev

      - name: Clean build directory
        run: make COLOR=0 clean

      - name: Build release
        if: matrix.name == 'release'
        run: |
          make AUTO_INSTALL=yes COLOR=0 JOBS=4 \
            strip \
            SNES_DIAGNOSTICS=0 \
            SNES_TARGET_PROFILE=1 \
            PROFILE=0 \
            PACK=0

      - name: Verify release CPU
        if: matrix.name == 'release'
        run: |
          python3 -m pip install --quiet unicorn==2.1.4 pyelftools==0.32
          python3 tools/cputest/check_ps2_cpu.py build/SNESticle.elf
          python3 tools/cputest/check_ps2_echo.py build/SNESticle.elf
          python3 tools/cputest/check_ps2_voice.py build/SNESticle.elf

      - name: Keep unpacked release ELF
        if: matrix.name == 'release'
        run: |
          mkdir -p unpacked
          cp build/SNESticle.stripped.elf unpacked/SNESticle-unpacked.elf
          test -s unpacked/SNESticle-unpacked.elf

      - name: Upload unpacked release ZIP
        if: matrix.name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: SNESticle-release-unpacked
          path: unpacked/SNESticle-unpacked.elf
          if-no-files-found: error
          retention-days: 30

      - name: Pack stripped release ELF
        if: matrix.name == 'release'
        run: |
          # Build/repair the host ps2-packer, then feed it the already-stripped
          # ELF. This guarantees the downloadable production ELF has no debug
          # symbols before compression.
          make AUTO_INSTALL=yes COLOR=0 fix-packer
          PACKER="${XDG_CACHE_HOME:-$HOME/.cache}/ps2dev/ps2-packer-src/ps2-packer"
          test -x "$PACKER"

          mkdir -p artifacts
          "$PACKER" \
            "$(pwd)/build/SNESticle.stripped.elf" \
            "$(pwd)/artifacts/SNESticle.elf"

          test -s artifacts/SNESticle.elf
          echo "=== Release: stripped + packed ==="
          file artifacts/SNESticle.elf
          ls -lh artifacts/SNESticle.elf

      - name: Build and pack diagnostic ELF (retain separate symbols)
        if: matrix.name != 'release' && matrix.name != 'boot-recovery'
        run: |
          make AUTO_INSTALL=yes COLOR=0 JOBS=4 \
            strip \
            SNES_DIAGNOSTICS=${{ matrix.diagnostics }} \
            SNES_VU0_SHADOW=${{ matrix.vu0_shadow }} \
            SNES_TARGET_PROFILE=0 \
            PROFILE=0 \
            PACK=0

          make AUTO_INSTALL=yes COLOR=0 fix-packer
          PACKER="${XDG_CACHE_HOME:-$HOME/.cache}/ps2dev/ps2-packer-src/ps2-packer"
          test -x "$PACKER"
          mkdir -p artifacts symbols
          cp build/SNESticle.elf symbols/SNESticle-${{ matrix.name }}-symbols.elf
          "$PACKER" "$(pwd)/build/SNESticle.stripped.elf" "$(pwd)/artifacts/SNESticle-${{ matrix.name }}.elf"
          test -s artifacts/SNESticle-${{ matrix.name }}.elf
          test "$(wc -c < artifacts/SNESticle-${{ matrix.name }}.elf)" -lt "$(wc -c < symbols/SNESticle-${{ matrix.name }}-symbols.elf)"
          echo "=== ${{ matrix.name }}: stripped + packed ==="
          file artifacts/SNESticle-${{ matrix.name }}.elf
          ls -lh artifacts/SNESticle-${{ matrix.name }}.elf

      - name: Build unpacked boot recovery ELF
        if: matrix.name == 'boot-recovery'
        run: |
          make AUTO_INSTALL=yes COLOR=0 JOBS=4 strip \
            SNES_DIAGNOSTICS=1 SNES_VU0_SHADOW=0 \
            SNES_TARGET_PROFILE=0 PROFILE=0 PACK=0 PS2_BOOT_RECOVERY=1
          mkdir -p artifacts
          cp build/SNESticle.stripped.elf artifacts/SNESticle-boot-recovery.elf
          test -s artifacts/SNESticle-boot-recovery.elf

      - name: Verify artifact contains exactly one ELF
        run: |
          test "$(find artifacts -maxdepth 1 -type f -name '*.elf' | wc -l)" -eq 1
          test "$(find artifacts -maxdepth 1 -type f | wc -l)" -eq 1
          find artifacts -maxdepth 1 -type f -printf '%f\n'

      - name: Upload build ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic symbols (unpacked, optional)
        if: matrix.name != 'release' && matrix.name != 'boot-recovery'
        uses: actions/upload-artifact@v4
        with:
          name: SNESticle-${{ matrix.name }}-symbols
          path: symbols/SNESticle-${{ matrix.name }}-symbols.elf
          if-no-files-found: error
          retention-days: 7
