name: SA-1 experimental host tests

on:
  pull_request:
  push:
    branches:
      - main
      - experimental/sa1-mips
      - perf/sa1-r5900
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build shared CPU tests
        run: ./tools/cputest/build.sh
      - name: Run shared CPU tests
        run: ./tools/cputest/cpu_test
      - name: Build SA-1 tests
        run: ./tools/sa1test/build.sh
      - name: Run SA-1 tests
        run: ./tools/sa1test/sa1_test
      - name: Build PPU/DMA regression tests
        run: ./tools/pputest/build.sh
      - name: Run PPU/DMA regression tests
        run: |
          ./tools/pputest/obj_test
          ./tools/pputest/oam_test
          ./tools/pputest/io_register_test
          ./tools/pputest/chrcache_test
          ./tools/pputest/chrcache_obj_only_test
          ./tools/pputest/bglinecache_test
          ./tools/pputest/vramstamp_test
          ./tools/pputest/mask_alignment_test
          ./tools/pputest/hires_test
          ./tools/pputest/audioschedule_test
          ./tools/pputest/audio_output_test
          ./tools/pputest/mode7_test
          ./tools/pputest/queue_test
          ./tools/pputest/spcio_test
          ./tools/pputest/spc700_test
          ./tools/pputest/dspmix_test
          ./tools/pputest/mixer_feedback_test
          ./tools/pputest/safe_frameskip_test
          ./tools/pputest/regioncadence_test
          ./tools/pputest/diag_test
          ./tools/pputest/brightness_test
          ./tools/pputest/targetprofile_test
      - name: Test asynchronous RFAuds2 PCM adapter
        run: SANITIZE=1 bash ./tools/rfauds2test/build.sh
      - name: Test mounted state destination enumeration
        run: python3 tools/statetest/check_roots.py
      - name: Test legacy and Mesen state bank payloads
        run: python3 tools/statetest/check_payloads.py
      - name: Test SMB frontend configuration and RPC flow
        run: python3 tools/smbtest/check_smb.py
      - name: Test MesenCE frontend with sanitizers
        run: SANITIZE=1 bash tools/mesencetest/build.sh
      - name: Test NES frontend controller mapping
        run: python3 tools/mesencetest/check_input.py
      - name: Build and test SuperFX core
        run: |
          bash tools/superfxtest/build.sh
          ./tools/superfxtest/gsu_test
      - name: Build ROM loader tests
        run: ./tools/romtest/build.sh
      - name: Run ROM loader tests
        run: ./tools/romtest/rom_test
      - name: Build netplay codec tests
        run: bash ./tools/netplaytest/build.sh
      - name: Run netplay codec tests
        run: ./tools/netplaytest/netplay_test
      - name: Build deterministic ROM Lab
        run: ./tools/romlab/build.sh
      - name: Run ROM Lab integration self-test
        run: ./tools/romlab/romlab self-test
