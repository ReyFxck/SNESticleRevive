name: MesenCE NES PS2 CI

on:
  push:
    branches:
      - ci/mesen-ps2-fixed-20260928
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout CI branch
        uses: actions/checkout@v4

      - name: Cache PS2DEV
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/ps2dev
            ~/.cache/ps2dev
          key: ps2dev-${{ runner.os }}-${{ runner.arch }}-mesen-ps2-v1

      - name: Install PS2DEV
        run: make AUTO_INSTALL=yes COLOR=0 ensure-ps2dev

      - name: Rebuild and verify PS2 overlay
        run: |
          set -euo pipefail
          cat ci/mesen/overlay.part* | base64 -d > /tmp/mesen-overlay.tar.xz
          echo "d47b8fc6554da1a892a9d4450aa5f588e09b6631f5b7824c51851f17687c5977  /tmp/mesen-overlay.tar.xz" | sha256sum -c -
          mkdir -p work/overlay work/base work/port
          tar -xJf /tmp/mesen-overlay.tar.xz -C work/overlay

      - name: Fetch MesenCE base
        run: |
          set -euo pipefail
          curl -L --fail --retry 3             https://github.com/nesdev-org/MesenCE/archive/20ba206cef5ba207c21203176d02cb9f43dda9fb.tar.gz             | tar -xz --strip-components=1 -C work/base
          cat ci/mesen/basefix.part* | base64 -d > /tmp/mesen-basefix.tar.xz
          echo "11678e378bbe4fcf874b424b43485754bfbde1cdb54b69af485b2b766f8169fb  /tmp/mesen-basefix.tar.xz" | sha256sum -c -
          tar -xJf /tmp/mesen-basefix.tar.xz -C work/base
          git -C work/base init -q

      - name: Apply NES PS2 port
        run: |
          set -euo pipefail
          cd work/overlay
          chmod +x setup.sh
          ./setup.sh "$GITHUB_WORKSPACE/work/base" "$GITHUB_WORKSPACE/work/port"

      - name: Install ROM browser frontend
        run: |
          set -euo pipefail
          base64 -d ci/mesen/rombrowser.b64 > /tmp/rombrowser.tar.xz
          echo "291c03a14cc60e771c55b43b90bf2439b75b24c3e1b6f9938ac1f63f0a3ba51e  /tmp/rombrowser.tar.xz" | sha256sum -c -
          tar -xJf /tmp/rombrowser.tar.xz -C work/port

      - name: Fix HostFS root browser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("work/port/main.cpp")
          s = p.read_text()

          # Keep the launcher URI so host: files can be reopened through
          # NetherSX2's SAF namespace when plain host:<name> is rejected.
          s = s.replace(
              "constexpr int VisibleRows = 19;\n",
              "constexpr int VisibleRows = 19;\nstd::string gBootPath;\n",
              1,
          )

          marker = """std::string HostEntryLeaf(const char* rawName)
          {
              if(!rawName) return {};
              const char* leaf = rawName;
              for(const char* p = rawName; *p; p++) {
                  if(*p == '/' || *p == '\\\\') leaf = p + 1;
              }
              return leaf;
          }
          """
          helper = marker + r'''
          bool BuildHostIoPath(const std::string& guestPath, std::string& out)
          {
              if(!IsHostPath(guestPath) || gBootPath.rfind("host:content://", 0) != 0) {
                  return false;
              }

              std::string uri = gBootPath.substr(5);
              size_t sep = uri.rfind("%2F");
              if(sep == std::string::npos) sep = uri.rfind("%2f");
              if(sep == std::string::npos) return false;

              std::string rel = guestPath.substr(5);
              while(!rel.empty() && (rel.front() == '/' || rel.front() == '\\')) {
                  rel.erase(rel.begin());
              }

              static const char hex[] = "0123456789ABCDEF";
              out = "host:" + uri.substr(0, sep) + "%2F";
              for(unsigned char ch : rel) {
                  if(ch == '/' || ch == '\\') {
                      out += "%2F";
                  } else if((ch >= 'A' && ch <= 'Z') ||
                            (ch >= 'a' && ch <= 'z') ||
                            (ch >= '0' && ch <= '9') ||
                            ch == '-' || ch == '_' || ch == '.' || ch == '~') {
                      out.push_back((char)ch);
                  } else {
                      out.push_back('%');
                      out.push_back(hex[(ch >> 4) & 15]);
                      out.push_back(hex[ch & 15]);
                  }
              }
              return true;
          }

          int OpenHostFile(const std::string& path)
          {
              int fd = fioOpen(path.c_str(), FIO_O_RDONLY);
              if(fd >= 0) return fd;

              std::string uriPath;
              if(BuildHostIoPath(path, uriPath)) {
                  fd = fioOpen(uriPath.c_str(), FIO_O_RDONLY);
              }
              return fd;
          }
          '''
          assert marker in s
          s = s.replace(marker, helper, 1)

          s = s.replace(
              "int fd = fioOpen(path.c_str(), FIO_O_RDONLY);\n    if(fd < 0) return false;\n    fioClose(fd);\n    return true;",
              "int fd = OpenHostFile(path);\n    if(fd < 0) return false;\n    fioClose(fd);\n    return true;",
              1,
          )

          old_ext = r'''bool HasNesExtension(const char* name)
          {
              if(!name) return false;
              const char* dot = strrchr(name, '.');
              if(!dot || strlen(dot) != 4) return false;
              return tolower((unsigned char)dot[1]) == 'n' &&
                     tolower((unsigned char)dot[2]) == 'e' &&
                     tolower((unsigned char)dot[3]) == 's' &&
                     dot[4] == '\0';
          }'''
          new_ext = r'''bool HasBrowserRomExtension(const char* name)
          {
              if(!name) return false;
              const char* dot = strrchr(name, '.');
              if(!dot) return false;
              return strcasecmp(dot, ".nes") == 0 || strcasecmp(dot, ".zip") == 0;
          }'''
          assert old_ext in s
          s = s.replace(old_ext, new_ext, 1)
          s = s.replace("HasNesExtension(", "HasBrowserRomExtension(")

          host_block = s.index("    if(IsHostPath(folder)) {")
          scan_start = s.index("            std::string child = JoinPath(folder, leaf);", host_block)
          scan_end = s.index("        }\n        fioDclose(dfd);", scan_start)
          new_host_scan = r'''            std::string child = JoinPath(folder, leaf);

              // NetherSX2 SAF can enumerate host: but rejects dopen(host:<child>)
              // probes. Trust the mode returned by the root dread instead.
              const unsigned mode = de.stat.mode;
              const bool isDir =
                  ((mode & 0x0038u) == 0x0020u) ||
                  ((mode & 0xF000u) == 0x1000u);

              if(isDir) {
                  entries.push_back({leaf, child, true});
              } else if(HasBrowserRomExtension(leaf.c_str())) {
                  entries.push_back({leaf, child, false});
              }
          '''
          s = s[:scan_start] + new_host_scan + s[scan_end:]


          # Start directly in host:. No device chooser and no assumed ROMS folder.
          old_start = '''    std::vector<std::string> pathStack;
              std::vector<BrowserEntry> entries = BuildRootEntries(argc, argv);'''
          new_start = '''    std::vector<std::string> pathStack = {"host:"};
              std::vector<BrowserEntry> entries = ListDirectory("host:");'''
          assert old_start in s
          s = s.replace(old_start, new_start, 1)

          old_back = '''            if(!pathStack.empty()) {
                          pathStack.pop_back();
                          entries = pathStack.empty() ? BuildRootEntries(argc, argv) : ListDirectory(pathStack.back());
                          selected = 0;
                      }'''
          new_back = '''            if(pathStack.size() > 1) {
                          pathStack.pop_back();
                          entries = ListDirectory(pathStack.back());
                          selected = 0;
                      }'''
          assert old_back in s
          s = s.replace(old_back, new_back, 1)

          # Rescans also remain rooted at host:.
          s = s.replace(
              "entries = pathStack.empty() ? BuildRootEntries(argc, argv) : ListDirectory(pathStack.back());",
              "entries = ListDirectory(pathStack.empty() ? std::string(\"host:\") : pathStack.back());"
          )

          # Reopen ROMs through the SAF URI fallback when direct host:<name> fails.
          s = s.replace(
              "int fd = fioOpen(path.c_str(), FIO_O_RDONLY);\n    if(fd < 0) return false;",
              "int fd = OpenHostFile(path);\n    if(fd < 0) return false;",
              1,
          )

          s = s.replace(
              "    fioInit();\n",
              "    fioInit();\n    if(argc > 0 && argv && argv[0]) gBootPath = argv[0];\n",
              1,
          )

          # UI text should describe what the browser actually accepts.
          s = s.replace("NO .NES FILES OR FOLDERS", "NO NES/ZIP FILES OR FOLDERS")
          s = s.replace("TRY MASS:/ROMS OR CDFS:/", "HOST: ROOT IS EMPTY")

          p.write_text(s)
          PY

      - name: Fix ROM launch and ZIP loading
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("work/port/main.cpp")
          s = p.read_text()

          inc = '#include "Utilities/VirtualFile.h"\n'
          assert inc in s
          s = s.replace(inc, inc + '#include "Utilities/miniz.h"\n', 1)

          marker = "void ConfigureSaveFolder(const std::string& romPath)\n"
          assert marker in s
          helper = r'''
          bool IsZipName(const std::string& path)
          {
              const char* dot = strrchr(path.c_str(), '.');
              return dot && strcasecmp(dot, ".zip") == 0;
          }

          std::string ForceNesExtensionLower(std::string name)
          {
              if(name.size() >= 4 && strcasecmp(name.c_str() + name.size() - 4, ".nes") == 0) {
                  name.replace(name.size() - 4, 4, ".nes");
              }
              return name;
          }

          bool ExtractFirstNesFromZip(const std::vector<uint8_t>& zipData,
                                      std::vector<uint8_t>& nesData,
                                      std::string& nesName)
          {
              nesData.clear();
              nesName.clear();
              if(zipData.empty()) return false;

              mz_zip_archive archive = {};
              if(!mz_zip_reader_init_mem(&archive, zipData.data(), zipData.size(), 0)) {
                  return false;
              }

              bool ok = false;
              const int count = (int)mz_zip_reader_get_num_files(&archive);
              for(int i = 0; i < count; i++) {
                  mz_zip_archive_file_stat st = {};
                  if(!mz_zip_reader_file_stat(&archive, i, &st) || !st.m_filename) continue;

                  std::string candidate = st.m_filename;
                  if(candidate.size() < 4 ||
                     strcasecmp(candidate.c_str() + candidate.size() - 4, ".nes") != 0) {
                      continue;
                  }

                  size_t outSize = 0;
                  void* out = mz_zip_reader_extract_file_to_heap(
                      &archive, st.m_filename, &outSize, 0);
                  if(out && outSize > 0) {
                      nesData.assign((uint8_t*)out, (uint8_t*)out + outSize);
                      mz_free(out);
                      nesName = ForceNesExtensionLower(candidate);
                      ok = true;
                      break;
                  }
                  if(out) mz_free(out);
              }

              mz_zip_reader_end(&archive);
              return ok;
          }

          '''
          s = s.replace(marker, helper + marker, 1)

          old_audio = '''    Ps2Audio audio;
              const bool audioReady = audio.Initialize();
              if(audioReady) {
                  emulator.GetSoundMixer()->RegisterAudioDevice(&audio);
              } else {
                  emulator.GetSettings()->GetAudioConfig().EnableAudio = false;
              }'''
          new_audio = '''    Ps2Audio audio;
              // Do not let audsrv.irx/HostFS block ROM startup.  Get video+core
              // booting first; audio can be re-enabled once the IRX path is fixed.
              const bool audioReady = false;
              emulator.GetSettings()->GetAudioConfig().EnableAudio = false;'''
          assert old_audio in s
          s = s.replace(old_audio, new_audio, 1)
          s = s.replace("    audio.Shutdown();", "    if(audioReady) audio.Shutdown();")

          old_rom = '''    std::vector<uint8_t> hostRomData;
              VirtualFile rom;
              if(IsHostPath(romPath)) {
                  if(ReadHostRom(romPath, hostRomData)) {
                      rom = VirtualFile(hostRomData.data(), hostRomData.size(), romPath);
                  }
              } else {
                  rom = VirtualFile(romPath);
              }'''
          new_rom = '''    std::vector<uint8_t> hostRomData;
              std::vector<uint8_t> extractedRomData;
              VirtualFile rom;
              if(IsHostPath(romPath)) {
                  if(ReadHostRom(romPath, hostRomData)) {
                      if(IsZipName(romPath)) {
                          std::string innerName;
                          if(ExtractFirstNesFromZip(hostRomData, extractedRomData, innerName)) {
                              printf("[zip] extracted %s (%u bytes)\\n",
                                     innerName.c_str(), (unsigned)extractedRomData.size());
                              rom = VirtualFile(extractedRomData.data(), extractedRomData.size(), innerName);
                          } else {
                              printf("[zip] no .nes inside archive or extraction failed\\n");
                          }
                      } else {
                          std::string virtualName = ForceNesExtensionLower(romPath);
                          rom = VirtualFile(hostRomData.data(), hostRomData.size(), virtualName);
                      }
                  }
              } else {
                  rom = VirtualFile(romPath);
              }'''
          assert old_rom in s
          s = s.replace(old_rom, new_rom, 1)

          p.write_text(s)

          mk = Path("work/port/Makefile")
          m = mk.read_text()
          if "src/Utilities/miniz.o" not in m:
              lines = m.splitlines()
              for i, line in enumerate(lines):
                  if "Makefile.eeglobal" in line and line.lstrip().startswith("include"):
                      lines.insert(i, "EE_OBJS += src/Utilities/miniz.o")
                      break
              else:
                  raise RuntimeError("Makefile.eeglobal include not found")
              m = "\n".join(lines) + "\n"
          mk.write_text(m)
          PY

      - name: Fix EE GCC compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("work/port/src/Core/NES/Mappers/Homebrew/Rainbow.cpp")
          s = p.read_text()
          old1 = "HexUtilities::ToHex(ctrl.FpgaRamSrc * 0x400)"
          new1 = "HexUtilities::ToHex(static_cast<uint16_t>(ctrl.FpgaRamSrc * 0x400))"
          old2 = "HexUtilities::ToHex(0x2000 + i * 0x400)"
          new2 = "HexUtilities::ToHex(static_cast<uint16_t>(0x2000 + i * 0x400))"
          assert old1 in s and old2 in s
          p.write_text(s.replace(old1, new1).replace(old2, new2))

          # The R5900 ABI/backend has trouble passing this desktop-oriented
          # structure by value when it contains two extra doubles.  The PS2
          # frontend only consumes the integer X/Y coordinates.
          p = Path("work/port/src/Core/Shared/Interfaces/IKeyManager.h")
          s = p.read_text()
          old = "\tdouble RelativeX;\n\tdouble RelativeY;\n"
          new = "#ifndef PS2_PORT\n\tdouble RelativeX;\n\tdouble RelativeY;\n#endif\n"
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path("work/port/src/Core/Shared/KeyManager.cpp")
          s = p.read_text()
          old = "\t_mousePosition.RelativeX = x;\n\t_mousePosition.RelativeY = y;\n"
          assert old in s
          p.write_text(s.replace(old, "", 1))

          p = Path("work/port/src/Utilities/CRC32.cpp")
          s = p.read_text()
          old = "#if defined(_MSC_VER) || defined(__MINGW32__) || defined(__aarch64__)"
          new = "#if defined(_MSC_VER) || defined(__MINGW32__) || defined(__aarch64__) || defined(PS2_PORT)"
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path("work/port/src/Core/Shared/BaseControlDevice.cpp")
          s = p.read_text()

          # Single EE thread: remove redundant RAII guards that stress the
          # current R5900 GCC reload allocator in this translation unit.
          s = re.sub(
              r"^[ \t]*auto lock = _stateLock\.AcquireSafe\(\);\n",
              "",
              s,
              flags=re.MULTILINE,
          )

          # Desktop movie/netplay text-state helpers are unused by PS2 pad input.
          start = s.index("void BaseControlDevice::SetTextState(string textState)")
          end = s.index("\nvoid BaseControlDevice::EnsureCapacity", start)
          replacement = r'''void BaseControlDevice::SetTextState(string textState)
          {
              (void)textState;
              ClearState();
          }

          string BaseControlDevice::GetTextState()
          {
              return string();
          }
          '''
          p.write_text(s[:start] + replacement + s[end:])
          PY
          cat >> work/port/Makefile <<'EOF'
          # Keep this troublesome TU conservative on the current R5900 GCC.
          src/Core/Shared/BaseControlDevice.o: EE_CXXFLAGS := $(filter-out -O0 -O1 -O2 -O3 -Os -Ofast,$(EE_CXXFLAGS)) -O0
          # Makefile.eeglobal links with EE_CC, so explicitly add the C++ runtime.
          EE_LIBS += -lstdc++ -lsupc++ -latomic
          EOF

      - name: Optimize NES PS2 hot path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # The first working port used -O1 only to get through the R5900 GCC
          # bring-up.  Keep BaseControlDevice's explicit -O0 workaround, but
          # build the rest of the NES core with -O2.
          mk = Path("work/port/Makefile")
          m = mk.read_text()
          m += """
          # Performance build: all normal C++ translation units at -O2.
          EE_CXXFLAGS := $(filter-out -O0 -O1 -O2 -O3 -Os -Ofast,$(EE_CXXFLAGS)) -O2
          """
          mk.write_text(m)

          p = Path("work/port/platform/Ps2Video.cpp")
          s = p.read_text()

          # Packets are rewritten every frame. UCAB keeps packet writes coherent
          # without flushing the entire EE data cache.
          s = s.replace(
              "_drawPacket = packet_init(64, PACKET_NORMAL);",
              "_drawPacket = packet_init(64, PACKET_UCAB);",
              1,
          )

          old = '''    // Convert Mesen's 9-bit NES palette index into GS RGBA.  Fill the unused
              // bottom 16 texture rows with black so stale data can never leak onscreen.
              for(uint32_t y = 0; y < height; y++) {
                  const uint16_t* src = nesPixels + y * sourceStride;
                  uint32_t* dst = _pixels + y * TextureWidth;
                  for(uint32_t x = 0; x < width; x++) {
                      dst[x] = _palette[src[x] & 0x01FF];
                  }
                  for(uint32_t x = width; x < TextureWidth; x++) dst[x] = 0x80000000;
              }
              for(uint32_t y = height; y < TextureHeight; y++) {
                  memset(_pixels + y * TextureWidth, 0, TextureWidth * sizeof(uint32_t));
              }

              // Upload the 256x256 texture. draw_texture_transfer creates a DMA chain
              // that references the aligned CPU buffer, so the packet itself stays tiny.
              packet_t* transfer = packet_init(64, PACKET_NORMAL);
              if(!transfer) return;
              qword_t* tq = transfer->data;
              tq = draw_texture_transfer(tq, _pixels, TextureWidth, TextureHeight, GS_PSM_32, _texture->address, _texture->width);
              tq = draw_texture_flush(tq);
              // Source-chain DMA does not write back the EE data cache. The texture is
              // rebuilt by the CPU every frame, so flush before the GIF DMA reads it.
              FlushCache(0);
              dma_wait_fast();
              dma_channel_send_chain(DMA_CHANNEL_GIF, transfer->data, tq - transfer->data, 0, 0);
              dma_wait_fast();
              packet_free(transfer);
          '''
          new = '''    // Convert only the visible NES area.  The textured rectangle never samples
              // padding, so clearing the remaining 16 rows / right side every frame was
              // wasted EE work.
              for(uint32_t y = 0; y < height; y++) {
                  const uint16_t* src = nesPixels + y * sourceStride;
                  uint32_t* dst = _pixels + y * TextureWidth;
                  for(uint32_t x = 0; x < width; x++) {
                      dst[x] = _palette[src[x] & 0x01FF];
                  }
              }

              // Reuse one uncached DMA packet instead of malloc/free every frame.
              static packet_t* transfer = nullptr;
              if(!transfer) {
                  transfer = packet_init(64, PACKET_UCAB);
                  if(!transfer) return;
              }
              qword_t* tq = transfer->data;
              tq = draw_texture_transfer(tq, _pixels, TextureWidth, TextureHeight, GS_PSM_32, _texture->address, _texture->width);
              tq = draw_texture_flush(tq);

              // Flush only the pixel range DMA will read, not the entire EE D-cache.
              SyncDCache(_pixels, (uint8_t*)_pixels + TextureWidth * height * sizeof(uint32_t));
              dma_wait_fast();
              dma_channel_send_chain(DMA_CHANNEL_GIF, transfer->data, tq - transfer->data, 0, 0);
              dma_wait_fast();
          '''
          if old not in s:
              raise RuntimeError("Ps2Video hot path block not found")
          s = s.replace(old, new, 1)

          # While the core is below real-time, blocking on every VBlank quantizes
          # slow frames to 16.67 ms multiples (the ~66.7 ms spikes seen in NetherSX2).
          # This performance build lets the core run flat-out; once it reaches >60,
          # we'll restore a deadline-aware limiter instead of unconditional VSync.
          s = s.replace("    graph_wait_vsync();\n", "", 1)

          p.write_text(s)
          PY

      - name: Build NES PS2 ELF
        run: |
          set -euo pipefail
          export PS2DEV="$HOME/.local/ps2dev"
          export PS2SDK="$PS2DEV/ps2sdk"
          export PATH="$PS2DEV/ee/bin:$PS2DEV/bin:$PS2SDK/bin:$PATH"
          make -C work/port -j2
          test -s work/port/mesence-ps2.elf
          file work/port/mesence-ps2.elf
          ls -lh work/port/mesence-ps2.elf work/port/audsrv.irx || true

      - name: Upload PS2 build
        uses: actions/upload-artifact@v4
        with:
          name: MesenCE-NES-PS2-${{ github.sha }}
          path: |
            work/port/mesence-ps2.elf
            work/port/audsrv.irx
          if-no-files-found: error
