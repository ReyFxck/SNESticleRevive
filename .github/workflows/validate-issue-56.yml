name: Validate issue 56 PAL fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-issue-56.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION: 1.0.9
  TEST_TARGET_SHA: 2e852e9abe64896e9f0c40861fb7f3d93846776c

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout PAL fix
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_TARGET_SHA }}

      - name: Run ROM header regressions
        run: |
          chmod +x tools/romtest/build.sh
          tools/romtest/build.sh
          tools/romtest/rom_test

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget genisoimage

      - name: Install/check PS2DEV toolchain
        run: |
          make check-env AUTO_INSTALL=yes COLOR=0

      - name: Build PS2 ELF/ISO
        run: |
          make iso \
            APP_VERSION="$APP_VERSION" \
            AUTO_INSTALL=yes \
            COLOR=0 \
            JOBS=2 \
            PACK=1 \
            out="$GITHUB_WORKSPACE/dist"
          grep -a -l "SNESticle Revive PS2 v1.0.9" dist/*.elf
