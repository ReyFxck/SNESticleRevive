name: Validate Mesen timing sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-mesen-timing.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION: 1.0.9
  TARGET_SHA: 4f2d739f392e9acc1df5f0a937a9a59e3f6ad9c0

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout timing changes
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget genisoimage

      - name: Run host regressions
        run: |
          cd tools/pputest
          ./build.sh
          ./obj_test
          ./oam_test
          ./chrcache_test
          ./audioschedule_test
          ./mode7_test
          ./queue_test
          ./safe_frameskip_test
          ./diag_test
          cd ../romtest
          ./build.sh
          ./rom_test
          cd ../cputest
          ./build.sh
          ./cpu_test

      - name: Install/check PS2DEV
        run: make check-env AUTO_INSTALL=yes COLOR=0

      - name: Build PS2 ELF and ISO
        run: |
          rm -rf dist
          mkdir -p dist
          make iso APP_VERSION="$APP_VERSION" AUTO_INSTALL=yes COLOR=0 JOBS=2 PACK=1 out="$GITHUB_WORKSPACE/dist"
          ls -lh dist

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: mesen-timing-test-build
          path: |
            dist/*.elf
            dist/*.iso
          if-no-files-found: error
