name: Build SNES performance diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-snes-perf-diag.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION: 1.0.9
  TARGET_SHA: 986718b38ff21a5eebe51a03de8aa03b5dff0940

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout diagnostic target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget genisoimage

      - name: Run host regressions
        run: |
          cd tools/pputest
          ./build.sh
          ./obj_test
          ./oam_test
          ./chrcache_test
          ./audioschedule_test
          ./mode7_test
          ./queue_test
          ./safe_frameskip_test
          ./diag_test
          cd ../romtest
          ./build.sh
          ./rom_test
          cd ../cputest
          ./build.sh
          ./cpu_test

      - name: Install/check PS2DEV
        run: make check-env AUTO_INSTALL=yes COLOR=0

      - name: Build low-overhead diagnostic ELF and ISO
        run: |
          rm -rf dist
          mkdir -p dist
          make iso \
            APP_VERSION="$APP_VERSION" \
            SNES_DIAGNOSTICS=1 \
            PROFILE=0 \
            AUTO_INSTALL=yes \
            COLOR=0 \
            JOBS=2 \
            PACK=1 \
            out="$GITHUB_WORKSPACE/dist"
          ls -lh dist

      - name: Upload diagnostic build
        uses: actions/upload-artifact@v4
        with:
          name: snes-perf-diagnostic-build
          path: |
            dist/*.elf
            dist/*.iso
          if-no-files-found: error
