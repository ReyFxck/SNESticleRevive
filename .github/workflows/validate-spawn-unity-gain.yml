name: Validate Spawn unity gain

on:
  push:
    branches:
      - test/spawn-unity-gain
    paths:
      - .github/workflows/validate-spawn-unity-gain.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION: 1.0.9
  TARGET_SHA: 5d126770f79ca6fbfc28f4f8cf57f49deea6bcf1

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget genisoimage

      - name: Host regressions
        run: |
          cd tools/pputest
          ./build.sh
          ./obj_test
          ./oam_test
          ./chrcache_test
          ./audioschedule_test
          ./mode7_test
          ./queue_test
          ./safe_frameskip_test
          ./diag_test
          cd ../romtest
          ./build.sh
          ./rom_test
          cd ../cputest
          ./build.sh
          ./cpu_test

      - name: Install/check PS2DEV
        run: make check-env AUTO_INSTALL=yes COLOR=0

      - name: Build normal PS2
        run: |
          rm -rf dist-normal
          mkdir -p dist-normal
          make clean
          make iso APP_VERSION="$APP_VERSION" AUTO_INSTALL=yes COLOR=0 JOBS=2 PACK=1 out="$GITHUB_WORKSPACE/dist-normal"

      - name: Build diagnostic PS2
        run: |
          rm -rf dist-diag
          mkdir -p dist-diag
          make clean
          make iso APP_VERSION="$APP_VERSION" SNES_DIAGNOSTICS=1 PROFILE=0 AUTO_INSTALL=yes COLOR=0 JOBS=2 PACK=1 out="$GITHUB_WORKSPACE/dist-diag"

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: spawn-unity-gain-builds
          path: |
            dist-normal/*.elf
            dist-normal/*.iso
            dist-diag/*.elf
            dist-diag/*.iso
          if-no-files-found: error
