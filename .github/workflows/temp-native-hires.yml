name: Temporary native hires validation

on:
  push:
    branches:
      - dev/1.1.1-ppu-accuracy

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Host mapper tests
        run: |
          set -euxo pipefail
          cd tools/romtest
          bash build.sh
          ./rom_test

      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y genisoimage

      - name: Full PS2 diagnostic build
        env:
          PS2DEV: ${{ runner.temp }}/ps2dev
        run: |
          set -euxo pipefail
          mkdir -p empty_roms
          make iso \
            ROMS="$PWD/empty_roms" \
            PACK=0 \
            JOBS=2 \
            AUTO_INSTALL=yes \
            VERBOSE=1 \
            SNES_DIAGNOSTICS=2 \
            APP_VERSION=1.1.1-native-hires \
            PS2DEV="$PS2DEV"

      - name: Package test kit
        run: |
          set -euxo pipefail
          mkdir -p artifact
          cp -a build/iso_root artifact/iso_root
          cp build/SNESticle.stripped.elf artifact/SNESticle-1.1.1-native-hires-diag.elf
          cp build/*.iso artifact/base-native-hires-diag.iso
          printf '%s\n' "$GITHUB_SHA" > artifact/BUILD_COMMIT.txt
          sha256sum artifact/base-native-hires-diag.iso artifact/SNESticle-1.1.1-native-hires-diag.elf > artifact/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: native-hires-diag-kit
          path: artifact/
          retention-days: 1
