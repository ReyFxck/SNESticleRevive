name: Issue 63 MX4SIO prerelease

on:
  push:
    branches:
      - fix/issue-63-mx4sio-bdm
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  TEST_VERSION: 1.0.8-issue63-test1
  RELEASE_TAG: issue-63-mx4sio-bdm-test1

jobs:
  build-and-prerelease:
    name: Build PS2 test package
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget xorriso

      - name: Install/check PS2DEV toolchain
        run: |
          make check-env AUTO_INSTALL=yes COLOR=0

      - name: Build standalone ELF package
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          make elf \
            APP_VERSION="$TEST_VERSION" \
            AUTO_INSTALL=yes \
            COLOR=0 \
            JOBS=2 \
            PACK=1 \
            out="$GITHUB_WORKSPACE/dist"
          (cd dist && sha256sum *.elf > SHA256SUMS.txt)
          ls -lh dist

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNESticle-Revive-issue-63-MX4SIO-test1
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub prerelease
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## MX4SIO boot regression test for #63

          This prerelease tests a focused fix for issue #63, where MX4SIO works
          after manually toggling it Off/On but can show `Driver Error` and lose
          `mass0:` after restarting SNESticle Revive.

          ### What changed

          - Split the common `bdm.irx + bdmfs_fatfs.irx` core from the
            USB-specific `usbd_mini + usbmass_bd` path.
          - MX4SIO now loads the common BDM/FatFs core before
            `mx4sio_bd.irx`.
          - USB remains lazy, so this does **not** revert the OPL boot-hang fix
            that removed USB initialization from the boot-critical path.
          - Video Config now shows the numeric MX4SIO error as `Err <code>`
            if the driver still fails.

          ### Included 1.0.8 development/test commits

          This package is built on the current 1.0.8 development tree and
          therefore also includes these code/test changes made after v1.0.7:

          - [f5d62b7](https://github.com/ReyFxck/SNESticleRevive/commit/f5d62b7e4cb06e83f23fd86dc0ac1eceb841ee4c)
            **Add universal SNES diagnostics and remove BG cache** — adds the
            `snesdiag-v1` diagnostic framework, bounded deep captures and the
            host-side analyzer/tests, while removing the experimental BG cache.
          - [1ee62bb](https://github.com/ReyFxck/SNESticleRevive/commit/1ee62bbeb73e66aae2fc7e2eaecb9b4b6e35ac9e)
            **Normalize project-owned source headers and comments** — source
            normalization/cleanup used by the current 1.0.8 test tree.
          - [ccfc61b](https://github.com/ReyFxck/SNESticleRevive/commit/ccfc61b6cc46fcbc19adab6b95e719a1eeb07573)
            **Fix DSP-4 LoROM mapping for Top Gear 3000** — gives DSP-4 its
            correct LoROM decode range and adds a dedicated mapping regression
            test.

          README, donation-image and old-changelog-only commits after v1.0.7 are
          intentionally omitted from this runtime-test list.

          ### Issue #63 test commits

          - [a775c31](https://github.com/ReyFxck/SNESticleRevive/commit/a775c31caa05b58cd41cdfabfc5f4c761dfec8b5)
            **fix(mx4sio): load shared BDM core before SD driver**
          - [c3c8e97](https://github.com/ReyFxck/SNESticleRevive/commit/c3c8e9733947d8ba8e71d1968f43b2a72798bff1)
            **chore(mx4sio): expose driver error code in test UI**
          - [40dfbd7](https://github.com/ReyFxck/SNESticleRevive/commit/40dfbd75c3e903d35e90037fdf9d92d856a6ad7c)
            **ci: publish MX4SIO issue 63 test prerelease**
          - [41ca9ad](https://github.com/ReyFxck/SNESticleRevive/commit/41ca9addaf4314ac62f12d67352f38f4c06b9f5f)
            **ci: validate issue 63 fix on pull requests**

          ### Please test

          1. Enable **MX4SIO (SD)** and save the setting.
          2. Fully power off the PS2, power it back on, and launch this build.
          3. Check whether MX4SIO stays **On** and whether `mass0:` is present
             without toggling MX4SIO Off/On.
          4. Repeat using Reset/IGR if available.
          5. If it still fails, report the exact `Err <code>`, PS2 model
             (SCPH-xxxxx), launch method (FMCB/wLaunchELF/OPL Apps/ISO), and
             whether USB storage is connected.

          Related: #63.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Keep prereleases ELF-only. Remove any ISO uploaded by an older run.
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              case "$asset" in
                *.iso|*.ISO)
                  gh release delete-asset "$RELEASE_TAG" "$asset" --yes
                  ;;
              esac
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" \
              --title "MX4SIO #63 test 1" \
              --notes-file /tmp/release-notes.md \
              --prerelease
          else
            gh release create "$RELEASE_TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "MX4SIO #63 test 1" \
              --notes-file /tmp/release-notes.md \
              --prerelease
          fi
